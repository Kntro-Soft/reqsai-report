name: Produccion

# A push to main (a merged release/X.Y.Z or hotfix/X.Y.Z pull request): find the candidate vX.Y.Z-rc.N whose
# tree hash equals this commit's tree (otherwise fail: main differs from what was reviewed), check the SHA-256
# of its documents and publish those same files as the GitHub Release vX.Y.Z on this commit, then open the
# back-merge pull request main → develop. Nothing is rebuilt and nothing is deployed, so there is no approval.

on:
  push:
    branches: [main]

concurrency:
  group: produccion-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish the release and back-merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # tag vX.Y.Z and its GitHub Release; the back-merge pull request is opened by reqsai-release-bot
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Publish the documents of the matching candidate as vX.Y.Z
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(.github/scripts/candidate.sh version VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nothing to release::v$version is already released."
            exit 0
          fi
          echo "released=false" >> "$GITHUB_OUTPUT"
          json=$(.github/scripts/candidate.sh find "$version" "$(git rev-parse 'HEAD^{tree}')")
          tag=$(jq -r .tag <<<"$json")
          dir="$RUNNER_TEMP/candidate"
          .github/scripts/candidate.sh fetch "$tag" "$dir"
          printf '%s' "$json" > "$RUNNER_TEMP/candidate.json"
          mapfile -t assets < <(jq -r --arg dir "$dir" '.assets | keys[] | "\($dir)/\(.)"' "$RUNNER_TEMP/candidate.json")
          url=$(.github/scripts/candidate.sh final "$RUNNER_TEMP/candidate.json" "$GITHUB_SHA" "${assets[@]}")
          echo "Released $url from $tag (same files, SHA-256 checked)." >> "$GITHUB_STEP_SUMMARY"

      - name: Check the release bot configuration
        if: steps.release.outputs.released == 'false'
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "::error title=Release bot not configured::The organization variable RELEASE_APP_ID and the organization secret RELEASE_APP_PRIVATE_KEY (GitHub App reqsai-release-bot) are required to open the back-merge pull request. Nothing falls back to GITHUB_TOKEN: its pull requests start no workflows."
            exit 1
          fi

      - name: Mint the release bot token
        id: bot
        if: steps.release.outputs.released == 'false'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The App ID; GitHub accepts it as the JWT issuer like the client ID.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # auto-merge
          permission-pull-requests: write
          permission-workflows: write # auto-merge of a back-merge that changes .github/workflows

      - name: Open the back-merge pull request into develop as reqsai-release-bot
        if: steps.release.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          body="$RUNNER_TEMP/back-merge.md"
          {
            echo "Gitflow back-merge of release $VERSION, now published as [v$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION)."
            echo
            echo "Brings the fixes made on the release or hotfix branch (and its version bump) back into \`develop\`. Merge it with a merge commit, never a squash, so \`develop\` keeps \`main\`'s history."
          } > "$body"
          url=$(.github/scripts/candidate.sh pr main develop "chore: merge release $VERSION back into develop" "$body")
          if [ -z "$url" ]; then
            echo "Back-merge: not needed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Back-merge: $url ($(.github/scripts/candidate.sh automerge "$url"))" >> "$GITHUB_STEP_SUMMARY"
