name: Generate PDF from README

on:
  push:
    branches: [main]

jobs:
  generate-pdf:
    name: Build README PDF
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      REPORT_NAME: ${{ vars.REPORT_NAME || 'ReqsAI-Report' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install md-to-pdf
        run: npm install -g md-to-pdf

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 \
            libasound2t64 || sudo apt-get install -y -qq libasound2

      - name: Generate PDF
        run: |
          md-to-pdf README.md \
            --pdf-options '{"format":"A4","margin":{"top":"20mm","right":"20mm","bottom":"20mm","left":"20mm"},"printBackground":true}' \
            --launch-options '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' \
            --basedir .
          mv README.pdf "${REPORT_NAME}.pdf"

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.REPORT_NAME }}-PDF
          path: ${{ env.REPORT_NAME }}.pdf
          retention-days: 90

      - name: Job summary
        run: |
          echo "## ReqsAI Report — PDF generado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Fecha** | $(date +'%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tamaño** | $(du -sh "${REPORT_NAME}.pdf" | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### [Descargar PDF](${{ steps.upload.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY

      - name: Attach to release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.REPORT_NAME }}.pdf
