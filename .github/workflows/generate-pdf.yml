name: Generate PDF from README

# Builds the PDF, Word and ZIP of the report. release.yml calls it ONCE per release candidate and stores the files
# as assets of the pre-release vX.Y.Z-rc.N; produccion.yml publishes those same files in vX.Y.Z. Run it by hand
# to preview the documents of any branch.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  generate-pdf:
    name: Build README PDF
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      REPORT_NAME: ${{ vars.REPORT_NAME || 'ReqsAI-Report' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install md-to-pdf
        run: npm install -g md-to-pdf

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 \
            libasound2t64 || sudo apt-get install -y -qq libasound2

      - name: Generate PDF
        run: |
          md-to-pdf README.md \
            --pdf-options '{"format":"A4","margin":{"top":"20mm","right":"20mm","bottom":"20mm","left":"20mm"},"printBackground":true}' \
            --launch-options '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' \
            --basedir .
          mv README.pdf "${REPORT_NAME}.pdf"

      - name: Upload PDF artifact
        id: upload-pdf
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.REPORT_NAME }}-PDF
          path: ${{ env.REPORT_NAME }}.pdf
          retention-days: 90

      - name: Install pandoc
        run: sudo apt-get install -y -qq pandoc

      - name: Render full HTML for Word conversion
        run: |
          md-to-pdf README.md --as-html --basedir . \
            --launch-options '{"args":["--no-sandbox","--disable-setuid-sandbox"]}'
          mv README.html report-source.html

      - name: Generate Word document
        run: |
          pandoc report-source.html \
            --reference-doc=.github/templates/word-reference-template.docx \
            --toc --toc-depth=3 \
            --metadata title="${REPORT_NAME}" --metadata lang=es-PE \
            -o "${REPORT_NAME}.docx"

      - name: Enable auto-update of the Word table of contents
        run: |
          python3 - "${REPORT_NAME}.docx" <<'PY'
          import re
          import sys
          import zipfile

          path = sys.argv[1]
          with zipfile.ZipFile(path, "r") as zin:
              items = zin.infolist()
              data = {item.filename: zin.read(item.filename) for item in items}

          settings = data["word/settings.xml"].decode("utf-8")
          if "<w:updateFields" not in settings:
              anchor = re.search(r"<w:compat\b", settings)
              insert_at = anchor.start()
              settings = (
                  settings[:insert_at]
                  + '<w:updateFields w:val="true"/>'
                  + settings[insert_at:]
              )
              data["word/settings.xml"] = settings.encode("utf-8")

          with zipfile.ZipFile(path, "w", zipfile.ZIP_DEFLATED) as zout:
              for item in items:
                  zout.writestr(item, data[item.filename])
          PY

      - name: Upload Word artifact
        id: upload-docx
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.REPORT_NAME }}-DOCX
          path: ${{ env.REPORT_NAME }}.docx
          retention-days: 90

      - name: Create ZIP bundle
        run: zip -j "${REPORT_NAME}.zip" "${REPORT_NAME}.pdf" "${REPORT_NAME}.docx"

      - name: Upload ZIP artifact
        id: upload-zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.REPORT_NAME }}-ZIP
          path: ${{ env.REPORT_NAME }}.zip
          retention-days: 90

      - name: Job summary
        env:
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          PDF_URL: ${{ steps.upload-pdf.outputs.artifact-url }}
          DOCX_URL: ${{ steps.upload-docx.outputs.artifact-url }}
          ZIP_URL: ${{ steps.upload-zip.outputs.artifact-url }}
        run: |
          {
            echo "## ReqsAI Report — documentos generados"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Commit** | \`$SHA\` |"
            echo "| **Branch** | \`$REF_NAME\` |"
            echo "| **Fecha** | $(date +'%Y-%m-%d %H:%M UTC') |"
            echo "| **Tamaño PDF** | $(du -sh "${REPORT_NAME}.pdf" | cut -f1) |"
            echo "| **Tamaño Word** | $(du -sh "${REPORT_NAME}.docx" | cut -f1) |"
            echo "| **Tamaño ZIP** | $(du -sh "${REPORT_NAME}.zip" | cut -f1) |"
            echo ""
            echo "### [Descargar PDF]($PDF_URL)"
            echo "### [Descargar Word]($DOCX_URL)"
            echo "### [Descargar ZIP]($ZIP_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
